name: Build & Release P2PTap APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - all
      create_release:
        description: 'Publish a GitHub Release; this run creates and pushes the version tag'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Existing tag to attach the release to, used when create_release is enabled'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build P2PTap Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Go (for p2ptap.aar compilation)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'p2ptap-core/go.mod'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android toolchains
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.14904198"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Compile Go p2ptap.aar & Extract Commit Hash
        id: build_go
        run: |
          # Detect Go submodule directory
          GO_DIR=""
          if [ -d "p2ptap-core" ]; then
            GO_DIR="p2ptap-core"
          elif [ -d "core" ]; then
            GO_DIR="core"
          fi

          if [ -n "${GO_DIR}" ]; then
            GO_COMMIT=$(git -C "${GO_DIR}" rev-parse --short HEAD || echo "dev")
          else
            GO_COMMIT="dev"
          fi

          echo "go_commit=${GO_COMMIT}" >> $GITHUB_OUTPUT
          echo "Go Engine Commit Hash: ${GO_COMMIT}"

          # Install gomobile and compile p2ptap.aar if Go source exists
          if [ -n "${GO_DIR}" ]; then
            echo "Installing gomobile..."
            go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
            export PATH=$PATH:$(go env GOPATH)/bin
            go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
            gomobile init
            
            echo "Building p2ptap.aar from ${GO_DIR}..."
            # Build through the same script Android validation runs, so the
            # gomobile flags can only drift in one place. An earlier inline copy
            # of this invocation kept -checklinkname=0 in GOFLAGS, but gomobile
            # overrode it with its own explicit `go build -ldflags`; the script
            # carries the flag inside that -ldflags string, where the linker
            # actually sees it. It is required because github.com/wlynxg/anet
            # (pulled in by pion/transport/v3) //go:linkname's into net.zoneCache,
            # which the Go 1.23+ linker rejects as "invalid reference".
            # Stamp the engine with its exact version: build-aar.sh injects this
            # into the Go binary via P2PTAP_VERSION. It is deliberately NOT
            # exported as APP_VERSION_NAME any more — versionName is the app's
            # version and gradle derives it from this repo (mobile/build.gradle.kts),
            # so the APK/About card track the Android build, not the engine.
            # Running get_version.sh once here keeps the two values from
            # disagreeing if the engine were rebuilt separately.
            CORE_VERSION="$(bash "${GO_DIR}/scripts/get_version.sh")"
            echo "Core version: ${CORE_VERSION}"
            P2PTAP_VERSION="${CORE_VERSION}" bash "${GO_DIR}/scripts/build-aar.sh"
            mkdir -p core/libs
            cp "${GO_DIR}/bin/p2ptap.aar" core/libs/p2ptap.aar
            echo "p2ptap.aar built successfully!"
          else
            echo "No Go source directory found, using existing core/libs/p2ptap.aar"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore File from Secret
        id: prepare_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PUBLISHING_RELEASE: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          # A published APK is signature-locked for whoever installed it: one
          # signed with the Android test key can never be updated in place by a
          # build signed with the production key, so the signature mismatch forces
          # a full reinstall that drops the user's config. Publishing without a
          # real keystore therefore fails hard; artifact-only dispatches may still
          # fall back to the test key, since nothing gets published there.
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > mobile/keystore.jks
            cp mobile/keystore.jks tv/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "keystore_available=true" >> $GITHUB_OUTPUT
          elif [ "${PUBLISHING_RELEASE}" = "true" ]; then
            echo "::error::KEYSTORE_BASE64 is missing, but this build publishes a GitHub Release"
            echo "::error::add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets"
            exit 1
          else
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            echo "::warning ::No production signing key configured; test-signing this artifact-only build."
          fi

      - name: Build Android APK
        env:
          KEYSTORE_FILE: "keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          SIGNING_ARGS=""
          if [ "${{ steps.prepare_keystore.outputs.keystore_available }}" != "true" ]; then
            SIGNING_ARGS="-PTEST_SIGNING=true"
          fi

          # Build debug (debug + all)
          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "all" ]; then
            ./gradlew testDebugUnitTest :mobile:lintDebug :tv:lintDebug :mobile:assembleDebug :tv:assembleDebug $SIGNING_ARGS
          fi

          # Build release (release + all)
          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "all" ]; then
            ./gradlew :mobile:assembleRelease :tv:assembleRelease $SIGNING_ARGS
            # AAB must be built without ABI splits: the bundle carries all ABIs
            # itself, and AGP rejects splits when building a bundle.
            ./gradlew :mobile:bundleRelease :tv:bundleRelease -PNO_SPLITS $SIGNING_ARGS
          fi

      - name: Prepare APK Outputs & Version Naming
        id: prepare_apk
        run: |
          mkdir -p outputs
          
          INPUT_RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          INPUT_CREATE_RELEASE="${{ github.event.inputs.create_release }}"

          # Gradle is the single source of truth for the version pair, set in
          # mobile/build.gradle.kts from *this* repo: versionCode is
          # APP_VERSION_CODE or the number of v* tags plus one, and versionName
          # is "v1.0.YYYYMMDD.<repoCount>-<repoHash>". The Go engine carries its
          # own version separately (P2PTAP_VERSION, stamped into the AAR). Read
          # both back out of the APK that is about to be published, so the file
          # and release names can never drift from what the APK actually carries.
          AAPT2="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt2"
          # With splits { abi { isEnable = true } } AGP names the all-ABI output
          # mobile-universal-release.apk, not mobile-release.apk. Match both so
          # this step keeps working if splits are ever turned off again.
          RELEASE_APK_DIR="mobile/build/outputs/apk/release"
          UNIVERSAL_APK="$(ls "${RELEASE_APK_DIR}"/mobile-release.apk "${RELEASE_APK_DIR}"/mobile-universal-release.apk 2>/dev/null | head -1)"
          if [ -z "${UNIVERSAL_APK}" ]; then
            echo "::error::no universal release APK found under ${RELEASE_APK_DIR}"
            ls -1 "${RELEASE_APK_DIR}" || true
            exit 1
          fi
          BADGING="$("$AAPT2" dump badging "$UNIVERSAL_APK" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [ -z "${VERSION_CODE}" ] || [ -z "${VERSION_NAME}" ]; then
            echo "::error::could not read versionCode/versionName from the release APK: ${BADGING}"
            exit 1
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Gradle version: ${VERSION_NAME} (${VERSION_CODE})"
          
          # A GitHub Release is keyed by a tag, and action-gh-release will not
          # create one. This workflow runs from a branch, so the run names the
          # tag from the version gradle just stamped and pushes it here, at the
          # commit that was built; without that a click in the Actions UI could
          # never publish a release on its own. VERSION_NAME is already the full
          # scheme (v1.0.YYYYMMDD.N-hash), so tag, release and APK share a string.
          # Tag pushes are deliberately NOT a trigger: such a run would already
          # see the new tag, so its tag-count versionCode came out one higher and
          # it republished the same commit under a different code.
          RELEASE_TAG="${VERSION_NAME}"
          if [ "${INPUT_CREATE_RELEASE}" = "true" ]; then
            RELEASE_TAG="${INPUT_RELEASE_TAG:-${VERSION_NAME}}"
            if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null \
                && ! git ls-remote --exit-code --quiet --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
              # Annotated tags need a committer identity, which actions/checkout
              # does not configure (it only sets up auth).
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a -m "P2PTap Android ${RELEASE_TAG}" "${RELEASE_TAG}" "${GITHUB_SHA}"
              git push origin "refs/tags/${RELEASE_TAG}"
              echo "Created and pushed tag ${RELEASE_TAG} at ${GITHUB_SHA}"
            else
              echo "Tag ${RELEASE_TAG} already exists"
            fi
          fi
          RELEASE_NAME="${RELEASE_TAG}"
          APK_NAME="p2ptap-mobile-${VERSION_NAME}.apk"
          
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          # Release APKs: only when build_type is release or all
          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "all" ]; then
            cp "$UNIVERSAL_APK" "outputs/${APK_NAME}"

            # Per-ABI APKs from splits { abi { isEnable = true } } in
            # mobile/build.gradle.kts: ~37 MB each instead of the ~136 MB universal
            # one, because each carries only its own libgojni.so. The universal
            # build is already copied above, so skip it here.
            for apk in "${RELEASE_APK_DIR}"/mobile-*-release.apk; do
              [ -e "$apk" ] || continue
              base="$(basename "$apk" .apk)"
              abi="${base#mobile-}"
              abi="${abi%-release}"
              [ "${abi}" = "universal" ] && continue
              cp "$apk" "outputs/${APK_NAME%.apk}-${abi}.apk"
            done

            # Required to deobfuscate crash reports. R8 rewrites every app
            # symbol, so a release stack trace is unreadable without this file;
            # keep it next to the APKs so it ships with the release.
            cp mobile/build/outputs/mapping/release/mapping.txt "outputs/${APK_NAME%.apk}-mapping.txt"

            # TV APKs: same structure as mobile, from the :tv module.
            TV_RELEASE_APK_DIR="tv/build/outputs/apk/release"
            TV_UNIVERSAL_APK="$(ls "${TV_RELEASE_APK_DIR}"/tv-release.apk "${TV_RELEASE_APK_DIR}"/tv-universal-release.apk 2>/dev/null | head -1)"
            if [ -n "${TV_UNIVERSAL_APK}" ]; then
              TV_APK_NAME="p2ptap-tv-${VERSION_NAME}.apk"
              cp "$TV_UNIVERSAL_APK" "outputs/${TV_APK_NAME}"

              for apk in "${TV_RELEASE_APK_DIR}"/tv-*-release.apk; do
                [ -e "$apk" ] || continue
                base="$(basename "$apk" .apk)"
                abi="${base#tv-}"
                abi="${abi%-release}"
                [ "${abi}" = "universal" ] && continue
                cp "$apk" "outputs/${TV_APK_NAME%.apk}-${abi}.apk"
              done

              cp tv/build/outputs/mapping/release/mapping.txt "outputs/${TV_APK_NAME%.apk}-mapping.txt"
            fi
          fi

          # Debug APKs: only when build_type is debug or all
          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "all" ]; then
            # Splits apply to the debug variant too, so its all-ABI output is
            # mobile-universal-debug.apk rather than mobile-debug.apk.
            DEBUG_APK="$(ls mobile/build/outputs/apk/debug/mobile-debug.apk mobile/build/outputs/apk/debug/mobile-universal-debug.apk 2>/dev/null | head -1)"
            cp "$DEBUG_APK" "outputs/${APK_NAME%.apk}-debug.apk"

            # TV debug APK, same logic as mobile debug.
            TV_DEBUG_APK="$(ls tv/build/outputs/apk/debug/tv-debug.apk tv/build/outputs/apk/debug/tv-universal-debug.apk 2>/dev/null | head -1)"
            if [ -n "${TV_DEBUG_APK}" ]; then
              cp "$TV_DEBUG_APK" "outputs/p2ptap-tv-${VERSION_NAME}-debug.apk"
            fi
          fi

          # AAB files: always copy to a separate directory for artifact-only upload.
          # AAB must never go to a public GitHub Release — it contains the full
          # app bundle including all ABIs and native code.
          mkdir -p aab
          MOBILE_AAB="mobile/build/outputs/bundle/release/mobile-release.aab"
          if [ -f "$MOBILE_AAB" ]; then
            cp "$MOBILE_AAB" "aab/${APK_NAME%.apk}.aab"
          fi
          TV_AAB="tv/build/outputs/bundle/release/tv-release.aab"
          if [ -f "$TV_AAB" ]; then
            cp "$TV_AAB" "aab/p2ptap-tv-${VERSION_NAME}.aab"
          fi

      - name: Upload Build Artifacts (artifact-only builds)
        if: ${{ github.event.inputs.create_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: p2ptap-android-apk
          path: |
            outputs/*
            aab/*
          retention-days: 14

      - name: Upload AAB Artifact (always available, never in public release)
        uses: actions/upload-artifact@v4
        with:
          name: p2ptap-android-aab
          path: aab/*
          retention-days: 14

      - name: Create GitHub Release (create_release)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## 🚀 P2PTap Release: ${{ env.RELEASE_NAME }}
            
            - **Release Version**: `${{ env.RELEASE_NAME }}`
            - **APK versionName / versionCode**: `${{ env.VERSION_NAME }}` / `${{ env.VERSION_CODE }}`
            - **Go Engine Commit**: `${{ steps.build_go.outputs.go_commit }}`
            
            ### 📦 Phone APK (Android 8.0+)
            Download `p2ptap-mobile-*.apk` for phone and tablet devices.
            Per-ABI APKs are smaller (~37 MB each) than the universal build
            (~136 MB).
            
            ### 📺 TV APK (Android TV 12+)
            Download `p2ptap-tv-*.apk` for Android TV (leanback) devices.
            The TV build shares the same applicationId as the phone build,
            so they replace each other on the same device — choose the one
            that matches your device form factor.
            
            ### 🔧 Mapping files
            `*-mapping.txt` files are included for deobfuscating crash
            reports from R8-obfuscated releases.
            
            ### 📦 AAB (not included in this release)
            `.aab` bundles are available as CI artifacts only (see the
            **p2ptap-android-aab** artifact in this workflow run). They are
            never published to GitHub Releases because the signed bundle
            contains the full app code and native libraries.
            
            ---
            *Automated Release build by GitHub Actions.*
          files: outputs/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
