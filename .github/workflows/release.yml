name: Build & Release P2PTap APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Publish a GitHub Release for this build; tag pushes always publish'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Existing tag to attach the release to, used when create_release is enabled'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build P2PTap Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Go (for p2ptap.aar compilation)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'p2ptap-core/go.mod'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android toolchains
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.14904198"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Compile Go p2ptap.aar & Extract Commit Hash
        id: build_go
        run: |
          # Detect Go submodule directory
          GO_DIR=""
          if [ -d "p2ptap-core" ]; then
            GO_DIR="p2ptap-core"
          elif [ -d "core" ]; then
            GO_DIR="core"
          fi

          if [ -n "${GO_DIR}" ]; then
            GO_COMMIT=$(git -C "${GO_DIR}" rev-parse --short HEAD || echo "dev")
          else
            GO_COMMIT="dev"
          fi

          echo "GO_COMMIT_HASH=${GO_COMMIT}" >> $GITHUB_ENV
          echo "go_commit=${GO_COMMIT}" >> $GITHUB_OUTPUT
          echo "Go Engine Commit Hash: ${GO_COMMIT}"

          # Install gomobile and compile p2ptap.aar if Go source exists
          if [ -n "${GO_DIR}" ]; then
            echo "Installing gomobile..."
            go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
            export PATH=$PATH:$(go env GOPATH)/bin
            go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
            gomobile init
            
            echo "Building p2ptap.aar from ${GO_DIR}..."
            # Build through the same script Android validation runs, so the
            # gomobile flags can only drift in one place. An earlier inline copy
            # of this invocation kept -checklinkname=0 in GOFLAGS, but gomobile
            # overrode it with its own explicit `go build -ldflags`; the script
            # carries the flag inside that -ldflags string, where the linker
            # actually sees it. It is required because github.com/wlynxg/anet
            # (pulled in by pion/transport/v3) //go:linkname's into net.zoneCache,
            # which the Go 1.23+ linker rejects as "invalid reference".
            # Stamp the APK with the exact engine version: build-aar.sh injects
            # this into the Go binary, and APP_VERSION_NAME hands the same value
            # to gradle for versionName. Passing it as P2PTAP_VERSION keeps the
            # two byte-identical instead of letting get_version.sh run twice.
            CORE_VERSION="$(bash "${GO_DIR}/scripts/get_version.sh")"
            echo "APP_VERSION_NAME=${CORE_VERSION}" >> $GITHUB_ENV
            echo "Core version: ${CORE_VERSION}"
            P2PTAP_VERSION="${CORE_VERSION}" bash "${GO_DIR}/scripts/build-aar.sh"
            mkdir -p app/libs
            cp "${GO_DIR}/bin/p2ptap.aar" app/libs/p2ptap.aar
            echo "p2ptap.aar built successfully!"
          else
            echo "No Go source directory found, using existing app/libs/p2ptap.aar"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore File from Secret
        id: prepare_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PUBLISHING_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' }}
        run: |
          # A published APK is signature-locked for whoever installed it: one
          # signed with the Android test key can never be updated in place by a
          # build signed with the production key, so the signature mismatch forces
          # a full reinstall that drops the user's config. Publishing without a
          # real keystore therefore fails hard; artifact-only dispatches may still
          # fall back to the test key, since nothing gets published there.
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > app/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "keystore_available=true" >> $GITHUB_OUTPUT
          elif [ "${PUBLISHING_RELEASE}" = "true" ]; then
            echo "::error::KEYSTORE_BASE64 is missing, but this build publishes a GitHub Release"
            echo "::error::add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets"
            exit 1
          else
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            echo "::warning ::No production signing key configured; test-signing this artifact-only build."
          fi

      - name: Build Android Release APK
        env:
          KEYSTORE_FILE: "keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GO_COMMIT_HASH: ${{ steps.build_go.outputs.go_commit }}
        run: |
          if [ "${{ steps.prepare_keystore.outputs.keystore_available }}" == "true" ]; then
            ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
          else
            ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease -PTEST_SIGNING=true
          fi

      - name: Prepare APK Outputs & Version Naming
        id: prepare_apk
        run: |
          mkdir -p outputs
          
          TAG_NAME="${{ github.ref_name }}"
          INPUT_RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          INPUT_CREATE_RELEASE="${{ github.event.inputs.create_release }}"

          # Gradle is the single source of truth for the version pair, set in
          # app/build.gradle.kts: versionCode is APP_VERSION_CODE or this repo's
          # revision count; versionName is APP_VERSION_NAME, which this workflow
          # exports from p2ptap-core/scripts/get_version.sh as
          # "v1.0.YYYYMMDD.<coreCount>-<coreHash>" and passes to build-aar.sh as
          # P2PTAP_VERSION so the Go engine carries the same string. Read both
          # back out of the APK that is about to be published, so the file and
          # release names can never drift from what the APK actually carries.
          AAPT2="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt2"
          # With splits { abi { isEnable = true } } AGP names the all-ABI output
          # app-universal-release.apk, not app-release.apk. Match both so this
          # step keeps working if splits are ever turned off again.
          RELEASE_APK_DIR="app/build/outputs/apk/release"
          UNIVERSAL_APK="$(ls "${RELEASE_APK_DIR}"/app-release.apk "${RELEASE_APK_DIR}"/app-universal-release.apk 2>/dev/null | head -1)"
          if [ -z "${UNIVERSAL_APK}" ]; then
            echo "::error::no universal release APK found under ${RELEASE_APK_DIR}"
            ls -1 "${RELEASE_APK_DIR}" || true
            exit 1
          fi
          BADGING="$("$AAPT2" dump badging "$UNIVERSAL_APK" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [ -z "${VERSION_CODE}" ] || [ -z "${VERSION_NAME}" ]; then
            echo "::error::could not read versionCode/versionName from the release APK: ${BADGING}"
            exit 1
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Gradle version: ${VERSION_NAME} (${VERSION_CODE})"
          
          # A GitHub Release is keyed by a tag, and action-gh-release does not
          # create missing tags. A v* tag push publishes the pushed tag; a manual
          # build publishes release_tag when create_release is enabled, falling
          # back to the gradle version.
          # VERSION_NAME is already the full tag scheme (v1.0.YYYYMMDD.N-hash),
          # so the tag, the release and the APK all key off the same string.
          RELEASE_TAG="${VERSION_NAME}"
          if [[ "${TAG_NAME}" == v* ]]; then
            RELEASE_TAG="${TAG_NAME}"
          elif [ "${INPUT_CREATE_RELEASE}" = "true" ]; then
            RELEASE_TAG="${INPUT_RELEASE_TAG:-${VERSION_NAME}}"
            if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null \
                && ! git ls-remote --exit-code --quiet --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
              echo "::error::create_release is enabled but tag '${RELEASE_TAG}' does not exist on origin"
              echo "::error::pass release_tag, or push the tag before dispatching"
              exit 1
            fi
          fi
          RELEASE_NAME="${RELEASE_TAG}"
          APK_NAME="P2PTap-${VERSION_NAME}.apk"
          
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          
          if [ "${{ github.event.inputs.build_type }}" != "debug" ]; then
            cp "$UNIVERSAL_APK" "outputs/${APK_NAME}"

            # Per-ABI APKs from splits { abi { isEnable = true } } in
            # app/build.gradle.kts: ~37 MB each instead of the ~136 MB universal
            # one, because each carries only its own libgojni.so. The universal
            # build is already copied above, so skip it here.
            for apk in "${RELEASE_APK_DIR}"/app-*-release.apk; do
              [ -e "$apk" ] || continue
              base="$(basename "$apk" .apk)"
              abi="${base#app-}"
              abi="${abi%-release}"
              [ "${abi}" = "universal" ] && continue
              cp "$apk" "outputs/${APK_NAME%.apk}-${abi}.apk"
            done

            # Required to deobfuscate crash reports. R8 rewrites every app
            # symbol, so a release stack trace is unreadable without this file;
            # keep it next to the APKs so it ships with the release.
            cp app/build/outputs/mapping/release/mapping.txt "outputs/${APK_NAME%.apk}-mapping.txt"
          fi
          # Splits apply to the debug variant too, so its all-ABI output is
          # app-universal-debug.apk rather than app-debug.apk.
          DEBUG_APK="$(ls app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-universal-debug.apk 2>/dev/null | head -1)"
          cp "$DEBUG_APK" "outputs/${APK_NAME%.apk}-debug.apk"

      - name: Upload Build Artifact (Manual Workflow Dispatch / Non-Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: P2PTap-Android-APK
          path: outputs/*
          retention-days: 14

      - name: Create GitHub Release (v* Tag Push or create_release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## 🚀 P2PTap Release: ${{ env.RELEASE_NAME }}
            
            - **Release Version**: `${{ env.RELEASE_NAME }}`
            - **APK versionName / versionCode**: `${{ env.VERSION_NAME }}` / `${{ env.VERSION_CODE }}`
            - **Go Engine Commit**: `${{ steps.build_go.outputs.go_commit }}`
            
            ### 📦 Download & Installation
            Download the signed APK below and install on Android 8.0+ devices.
            
            ---
            *Automated Release build by GitHub Actions.*
          files: outputs/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
