name: Android validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2ptap-core/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android toolchains
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.14904198"
      - name: Build current Go core for all Android ABIs
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
          gomobile init
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.14904198"
          bash p2ptap-core/scripts/build-aar.sh
          mkdir -p core/libs
          cp p2ptap-core/bin/p2ptap.aar core/libs/p2ptap.aar
      - uses: gradle/actions/setup-gradle@v4
      - name: Check locale completeness
        run: bash scripts/check-i18n.sh
      - name: Test, lint and build both variants
        run: |
          chmod +x gradlew
          # Lint the app modules only: :core has a local AAR dependency that
          # prevents AGP from producing the AAR lint needs to analyze.
          # Also target assemble explicitly — the shorthand would run
          # :core:assembleDebug, which triggers the same AAR-bundling error.
          ./gradlew testDebugUnitTest :mobile:lintDebug :tv:lintDebug \
            :mobile:assembleDebug :tv:assembleDebug \
            :mobile:assembleRelease :tv:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            mobile/build/outputs/apk/**/*.apk
            tv/build/outputs/apk/**/*.apk
