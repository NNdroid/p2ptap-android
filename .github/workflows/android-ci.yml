name: Android validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2ptap-core/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchains
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.14904198"
      - name: Build current Go core for all Android ABIs
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
          gomobile init
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.14904198"
          bash p2ptap-core/scripts/build-aar.sh
          mkdir -p app/libs
          cp p2ptap-core/bin/p2ptap.aar app/libs/p2ptap.aar
          echo "GO_COMMIT_HASH=$(git -C p2ptap-core rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build both variants
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/**/*.apk
